apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.fullnameOverride }}-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    rule_files:
      - prometheus-alerts.yml

    scrape_configs:
      - job_name: accounts-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['accounts-service:80']

      - job_name: cash-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['cash-service:80']

      - job_name: transfer-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['transfer-service:80']

      - job_name: notification-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['notification-service:80']

      - job_name: front-ui
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['front-ui:80']

  prometheus-alerts.yml: |
    groups:
      - name: bank-business-alerts
        rules:
          - alert: HighWithdrawalFailureRate
            expr: rate(bank_withdrawal_failed_total[5m]) > 1
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "High withdrawal failure rate"
              description: "Withdrawal failures exceed 1/sec for 1 minute"

          - alert: HighTransferFailureRate
            expr: rate(bank_transfer_failed_total[5m]) > 1
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "High transfer failure rate"
              description: "Transfer failures exceed 1/sec for 1 minute"

          - alert: HighNotificationSendFailureRate
            expr: rate(bank_notification_send_failed_total[5m]) > 2
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "High notification send failure rate"
              description: "Notification send failures exceed 2/sec for 1 minute"
